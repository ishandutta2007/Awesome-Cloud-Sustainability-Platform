<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a231c" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ea043" />
      <stop offset="50%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.0" />
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; font-size: 18px; fill: #8b949e; }
    .badge-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #2ea043; }
    .node { animation: pulse 3s infinite alternate; }
    .line-flow { stroke-dasharray: 10, 10; animation: dash 20s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -1000; } }
  </style>

  <!-- Background -->
  <rect width="1200" height="300" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2" />

  <!-- Background Dynamic Graph / Nodes (Lower Layer so Foreground Text is Clear) -->
  <g opacity="0.25">
    <!-- Grid pattern -->
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4" />
    <path d="M 200,0 L 200,300 M 400,0 L 400,300 M 600,0 L 600,300 M 800,0 L 800,300 M 1000,0 L 1000,300" stroke="#30363d" stroke-width="1" stroke-dasharray="4,4" />

    <!-- Animated Wave Line -->
    <path d="M 50,220 Q 200,120 400,180 T 800,130 T 1150,90" fill="none" stroke="url(#accentGrad)" stroke-width="4" filter="url(#glow)" />
    <path d="M 50,220 Q 200,120 400,180 T 800,130 T 1150,90 L 1150,280 L 50,280 Z" fill="url(#glowGrad)" />

    <!-- Animated Floating Circles -->
    <circle cx="850" cy="110" r="6" fill="#3fb950">
      <animate attributeName="r" values="6;10;6" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="650" cy="155" r="5" fill="#58a6ff">
      <animate attributeName="r" values="5;9;5" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="95" r="7" fill="#2ea043">
      <animate attributeName="r" values="7;12;7" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Decorative Leaf / Cloud Silhouette Top Right -->
  <g transform="translate(1020, 30)" opacity="0.15" fill="#3fb950">
    <path d="M80,20 C50,20 30,40 30,70 C15,70 0,85 0,105 C0,125 15,140 35,140 L125,140 C145,140 160,125 160,105 C160,88 148,74 132,71 C128,42 106,20 80,20 Z" />
  </g>

  <!-- Foreground Content Block -->
  <g transform="translate(60, 0)">
    <!-- Pill Category Badge -->
    <g transform="translate(0, 50)">
      <rect width="240" height="30" rx="15" fill="#162e21" stroke="#2ea043" stroke-width="1.5" />
      <text x="120" y="20" text-anchor="middle" class="badge-text">🌱 CLOUD SUSTAINABILITY &amp; ESG</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" class="title">Awesome Cloud Sustainability Platform ⚡</text>

    <!-- Subtitle -->
    <text x="0" y="170" class="subtitle">Curated SaaS Platforms, Carbon Accounting Engines &amp; Open-Source ESG Tools</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 210)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="160" height="28" rx="6" fill="#21262d" stroke="#30363d" />
      <text x="80" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c9d1d9">📊 Scopes 1, 2 &amp; 3</text>

      <!-- Tag 2 -->
      <rect x="175" y="0" width="160" height="28" rx="6" fill="#21262d" stroke="#30363d" />
      <text x="255" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c9d1d9">📜 CSRD &amp; GHG Protocol</text>

      <!-- Tag 3 -->
      <rect x="350" y="0" width="160" height="28" rx="6" fill="#21262d" stroke="#30363d" />
      <text x="430" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c9d1d9">🔓 Open-Source &amp; SaaS</text>

      <!-- Tag 4 -->
      <rect x="525" y="0" width="160" height="28" rx="6" fill="#21262d" stroke="#30363d" />
      <text x="605" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c9d1d9">🌿 Decarbonization</text>
    </g>
  </g>
</svg>
